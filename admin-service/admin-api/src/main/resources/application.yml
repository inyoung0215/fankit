server:
  port: 8086

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:mysql://localhost:3306/fankit_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: fankit
    password: fankit
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
